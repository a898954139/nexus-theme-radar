name: Nexus/Path Backtest (daily)

# Issue #12: score each transmission path against what Taiwan stocks did next.
#
# 09:50 UTC is 17:50 Taipei -- after the institutional-flows job (17:20), so
# the day's foreign net is in data/flows before it is summed by sector.
# Holidays are harmless: TWSE answers with no table, the day is marked closed.
#
# The first run backfills TWSE sector indices from --since (one request per
# weekday, 3 s apart: ~4 minutes); later runs fetch one day.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Paths to score: space-separated PATH_RULES ids, or 'all'"
        required: false
        default: "all"
        type: string
  # Scheduled runs moved to the Mac (job/mac/jobs.conf). Manual fallback only.

concurrency:
  group: backtest-paths-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Pipeline code and state live in the job layer (job/).
defaults:
  run:
    working-directory: job

jobs:
  backtest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "job/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update sector history (TWSE MI_INDEX + sector foreign net)
        run: python scripts/sector_history.py --data-dir data --since 2026-08-01

      - name: Run backtest
        env:
          PATHS: ${{ inputs.paths || 'all' }}
          # Same guard as the other dual-writes: master + production only.
          # Empty = skipped; the JSON result is unaffected.
          THEME_RADAR_DATABASE_URL: >-
            ${{ github.ref_type == 'branch'
                && github.ref_name == 'master'
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_BRANCH == github.ref_name
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_ENVIRONMENT == 'production'
                && secrets.THEME_RADAR_DATABASE_URL || '' }}
        run: |
          args=(--data-dir data)
          for path in $PATHS; do args+=(--path "$path"); done
          python scripts/backtest_path.py "${args[@]}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/sector-daily.json data/backtest reports/backtest
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update path backtest"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
