name: Backfill Symbol Fundamentals

# Manual only. Quarterly statements change four times a year, so this runs
# when the symbol list grows or a new quarter's filings land -- never on a
# schedule, and never inside the hourly radar run, whose job is publishing
# theme momentum rather than waiting on a scraped third party.

on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated tickers to restrict the run to (e.g. 2330,8299). Blank = whole symbol universe.
        required: false
        default: ""
        type: string
      force:
        description: Refetch even symbols already holding the current quarter
        required: false
        default: false
        type: boolean
      dry_run:
        description: Report what would be fetched without fetching or committing
        required: false
        default: false
        type: boolean
      max_workers:
        description: "Concurrent symbol fetches. Leave at 1: Goodinfo answers concurrent clients with HTTP 500."
        required: false
        default: "1"
        type: string

concurrency:
  # Two concurrent backfills would race on the same cache file and the loser's
  # results would be silently overwritten.
  group: backfill-fundamentals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill fundamentals
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_WORKERS: ${{ inputs.max_workers }}
        run: |
          args=(--data-dir data --symbols-index config/symbol_registry.tw.json --min-universe-size 2280 --skip-exchanges ESB --max-workers "${MAX_WORKERS:-1}")
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/backfill_all_fundamentals.py "${args[@]}"

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theme-symbol-fundamentals.json data/fundamentals-index.json data/fundamentals/
          if git diff --cached --quiet; then
            echo "No fundamentals changed -- every symbol already held the current quarter."
            exit 0
          fi
          git commit -m "chore: backfill symbol fundamentals"
          # The hourly radar run commits to the same branch; rebase rather than
          # fail the job on a race with it.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish to radar tables
        # The site reads only /api/v1 (docs/RADAR_RELATIONAL.md), so a failed
        # publish must fail the run. It runs after the commit so pipeline state
        # in data/ is kept even when the DB is unreachable.
        if: ${{ inputs.dry_run != true }}
        env:
          # Normalized radar tables behind /api/v1 (docs/RADAR_RELATIONAL.md).
          # Same secret + authorization variables as the other DB writers,
          # narrowed to master + production. Empty (fork, other branch) fails
          # this step only; the data commit above has already happened.
          THEME_RADAR_DATABASE_URL: >-
            ${{ github.ref_type == 'branch'
                && github.ref_name == 'master'
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_BRANCH == github.ref_name
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_ENVIRONMENT == 'production'
                && secrets.THEME_RADAR_DATABASE_URL || '' }}
        run: python scripts/radar_publish.py --data-dir data --dataset fundamentals --require
