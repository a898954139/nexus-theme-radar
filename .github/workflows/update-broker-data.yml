name: Broker Data (daily)

# Fubon publishes one broker-branch page per symbol. This runs after the
# market close and owns the complete fetch -> normalize -> coverage -> publish
# handoff; it never relies on a GITHUB_TOKEN push to trigger Pages.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5" # 21:30 Taipei

concurrency:
  group: update-broker-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 180
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and project broker data
        run: |
          python scripts/update_broker_data.py \
            --data-dir data \
            --min-attempt-coverage 1.0 \
            --min-universe-size 2280 \
            --delay 1.5

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/broker-stats.json data/broker-coverage.json data/broker-map

          if git diff --cached --quiet; then
            echo "No broker snapshot changes."
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update broker data"
          for attempt in 1 2 3; do
            if git push; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
