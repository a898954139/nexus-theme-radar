name: Broker Data (daily)

# Fubon publishes one broker-branch page per symbol. This runs after the
# market close and owns the complete fetch -> normalize -> coverage -> publish
# handoff; it never relies on a GITHUB_TOKEN push to trigger Pages.
on:
  workflow_dispatch:
  # Scheduled runs moved to the Mac (ops/mac/jobs.conf). Manual fallback only.

concurrency:
  group: update-broker-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 180
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and project broker data
        run: |
          python scripts/update_broker_data.py \
            --data-dir data \
            --min-attempt-coverage 1.0 \
            --min-universe-size 2280 \
            --delay 1.5

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/broker-stats.json data/broker-coverage.json data/broker-map

          if git diff --cached --quiet; then
            echo "No broker snapshot changes."
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update broker data"
          for attempt in 1 2 3; do
            if git push; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to radar tables
        # The site reads only /api/v1 (docs/RADAR_RELATIONAL.md), so a failed
        # publish must fail the run. It runs after the commit so pipeline state
        # in data/ is kept even when the DB is unreachable.
        env:
          # Normalized radar tables behind /api/v1 (docs/RADAR_RELATIONAL.md).
          # Same secret + authorization variables as the other DB writers,
          # narrowed to master + production. Empty (fork, other branch) fails
          # this step only; the data commit above has already happened.
          THEME_RADAR_DATABASE_URL: >-
            ${{ github.ref_type == 'branch'
                && github.ref_name == 'master'
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_BRANCH == github.ref_name
                && vars.THEME_RADAR_DB_HISTORY_AUTHORIZED_ENVIRONMENT == 'production'
                && secrets.THEME_RADAR_DATABASE_URL || '' }}
        run: python scripts/radar_publish.py --data-dir data --dataset broker --require
