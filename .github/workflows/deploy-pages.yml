name: Deploy Nexus Theme Radar

# A push made with GITHUB_TOKEN deliberately does not fire `on: push` -- that is
# how GitHub stops workflows from triggering each other. Both data jobs commit as
# github-actions[bot], so their hourly snapshots reached master and stopped
# there, and the site kept serving whatever the last human push had built.
#
# workflow_call lets those jobs invoke this one directly after they commit, so
# the build stays defined once here instead of being copy-pasted into each.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to build after a data workflow pushes a snapshot"
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy runtime data
        # Shared with the Vercel build (vercel.json) so both hosts publish the
        # same data set.
        run: sh scripts/copy_runtime_data.sh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
