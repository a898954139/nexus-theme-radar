name: Deploy Nexus Theme Radar (GitHub Pages redirect)

# The site moved to Vercel and reads only /api/v1 (docs/RADAR_RELATIONAL.md).
# GitHub Pages now serves a single redirect page so old links keep working;
# it publishes no data files.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_URL: https://nexus-theme-radar.vercel.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<HTML
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=${SITE_URL}">
            <link rel="canonical" href="${SITE_URL}">
            <title>Nexus Theme Radar 已搬家</title>
          </head>
          <body>
            <p>網站已搬到 <a href="${SITE_URL}">${SITE_URL}</a>。</p>
            <script>location.replace('${SITE_URL}' + location.hash);</script>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
