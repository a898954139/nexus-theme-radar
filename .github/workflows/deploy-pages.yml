name: Deploy Nexus Theme Radar

# A push made with GITHUB_TOKEN deliberately does not fire `on: push` -- that is
# how GitHub stops workflows from triggering each other. Both data jobs commit as
# github-actions[bot], so their hourly snapshots reached master and stopped
# there, and the site kept serving whatever the last human push had built.
#
# workflow_call lets those jobs invoke this one directly after they commit, so
# the build stays defined once here instead of being copy-pasted into each.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy runtime data
        run: |
          mkdir -p dist/data
          cp data/public-theme-ranking-v0.8.json dist/data/
          cp data/public-theme-momentum-latest-v0.9.json dist/data/
          cp data/public-theme-momentum-history-v0.9.json dist/data/
          cp data/theme-events.json dist/data/
          cp data/source-status.json dist/data/
          cp data/waytoagi-7d.json dist/data/
          cp data/institutional-rankings.json dist/data/
          cp data/institutional-flows.json dist/data/
          cp data/theme-symbol-fundamentals.json dist/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
