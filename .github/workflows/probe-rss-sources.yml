name: Probe RSS sources

# Maintainer check for source changes: reachability, ETag/Last-Modified
# support, and a snapshot duplicate rate for trial sources. Read-only; it
# never commits and shares nothing with the hourly radar's concurrency group.
on:
  pull_request:
    paths:
      - config/source_registry.tw.json
      - scripts/probe_rss_sources.py
      - scripts/evaluate_source_overlap.py
      - .github/workflows/probe-rss-sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - run: pip install -r requirements.txt
      - name: Probe registry RSS sources
        run: |
          python scripts/probe_rss_sources.py \
            --url 'udn_money_stock=https://money.udn.com/rssfeed/news/1001/5590?ch=money' \
            --url 'udn_money_headline=https://money.udn.com/rssfeed/news/1001/5588?ch=money' \
            --url 'udn_money_industry=https://money.udn.com/rssfeed/news/1001/5591?ch=money' \
            --url 'ctee_feed=https://www.ctee.com.tw/feed' \
            --url 'ctee_rss_stock=https://www.ctee.com.tw/rss_web/livenews/stock' \
            --url 'ctee_rss_all=https://www.ctee.com.tw/rss_web/livenews/ctee' \
            --url 'cna_fb_finance=https://feeds.feedburner.com/rsscna/finance' \
            --url 'cna_aie=https://www.cna.com.tw/rss/aie.xml' \
            --url 'cnbc_markets=https://www.cnbc.com/id/100003114/device/rss/rss.html' \
            --url 'marketwatch_top=https://feeds.content.dowjones.io/public/rss/mw_topstories'
