# nexus-theme-radar: the ONE schedule for every recurring job.
#
# The Mac runs these through launchd (job/mac/ntr.py renders one LaunchAgent
# per line). Nothing else schedules radar work: GitHub workflows are
# workflow_dispatch-only fallbacks and pg_cron has no radar jobs.
# Times are the Mac's local time, which ntr.py requires to be Asia/Taipei.
#
# Format:  name | when | command
#   when    one or more clauses joined by ";"
#             every 5m              fixed interval (minutes)
#             daily 06:05,07:05     every day at these times
#             weekdays 17:20        Mon-Fri at these times
#             hourly :17            every hour at minute 17
#             timeout 180m          kill after this long (default 90m;
#                                   'every' jobs: interval minus 30s)
#   command run by bash from job/ in the runner clone, job/.venv/bin first on PATH.
#           A trailing "\" continues the line.
#
# Jobs share one lock so two writers never touch data/ at once; a job waits
# for it. Jobs that never touch data/ are listed on the @nolock line.
#
# Edit here, merge to master; the Mac picks it up at the next `sync` run.

@nolock ingest analysis-prepare analysis-warm analysis-report broker-data prune-logs

# ---- every few minutes: news ingest (was pg_cron -> Vercel /api/cron/ingest)
ingest | every 5m | \
  python scripts/ingest_runner.py --group tw-news-a; a=$?; \
  python scripts/ingest_runner.py --group tw-news-b; b=$?; \
  python scripts/ingest_runner.py --group global-wire; c=$?; \
  exit $(( a || b || c ))

# ---- before the TW open: US close lands ~05:00 Taipei
pre-market | daily 06:05,07:05,08:05; hourly :35; timeout 20m | \
  python scripts/update_pre_market.py --output-dir data && \
  python scripts/radar_publish.py --data-dir data --dataset pre-market --require

analysis-prepare | weekdays 06:10,06:40; timeout 25m | \
  python scripts/prepare_analysis_queue.py --mode prepare

analysis-report | weekdays 07:30 | \
  bash mac/run_daily_analysis_report.sh

# ---- news-driven theme radar
# moat-screen (the screening report on the stock radar page) publishes without
# --require: a missing table before its migration must not fail the hour.
theme-radar | hourly :17; timeout 40m | \
  python scripts/update_theme_radar.py --output-dir data --window-hours 72 --max-events 500 --max-candidates 200 && \
  python scripts/build_theme_focus.py --data-dir data && \
  python scripts/radar_publish.py --data-dir data \
    --dataset theme-focus --dataset source-status --dataset theme-events \
    --dataset theme-ranking --dataset theme-momentum --dataset theme-momentum-history \
    --dataset stock-watchlist --dataset fundamentals --dataset stock-audit --require && \
  python scripts/radar_publish.py --data-dir data --dataset moat-screen

# ---- after the TW close: TWSE/TPEX institutional data is out by ~16:30
institutional-flows | weekdays 17:20; timeout 30m | \
  python scripts/update_institutional_flows.py --data-dir data --history-days 60 && \
  python scripts/update_institutional_rankings.py --data-dir data && \
  python scripts/build_theme_focus.py --data-dir data && \
  python scripts/radar_publish.py --data-dir data \
    --dataset institutional-flows --dataset institutional-rankings --dataset theme-focus --require

# Stock audit (個股健檢): TWSE close + PE are out by ~14:30, TAIFEX/US are the
# prior night's. Top TWSE watchlist names; a weekday holiday exits 0.
stock-audit | weekdays 17:40; timeout 25m | \
  python scripts/build_stock_audit.py --max-stocks 6 && \
  python scripts/radar_publish.py --data-dir data --dataset stock-audit --require

backtest-paths | weekdays 17:50; timeout 30m | \
  python scripts/sector_history.py --data-dir data --since 2026-08-01 && \
  python scripts/backtest_path.py --data-dir data --path all

analysis-warm | weekdays 20:10; timeout 25m | \
  python scripts/prepare_analysis_queue.py --mode warm

# ---- broker branch data is published in the evening (only its own publish
#      reads broker files, so it skips the data lock and cannot block the radar)
broker-data | weekdays 21:30; timeout 180m | \
  python scripts/update_broker_data.py --data-dir data \
    --min-attempt-coverage 1.0 --min-universe-size 2280 --delay 1.5 && \
  python scripts/radar_publish.py --data-dir data --dataset broker --require

# ---- housekeeping
prune-logs | daily 03:15 | python mac/ntr.py prune-logs
sync | hourly :50 | python mac/ntr.py sync
