<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS 台股題材雷達｜Theme Radar</title>
    <meta name="description" content="追蹤過去 72 小時的新聞與公告，整理熱門題材事件、關聯產業與三大法人籌碼的台股題材雷達。" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xz7wk63q2s");
    </script>
    <script>
      // Apply the saved or system theme before first paint (see App.tsx readThemeMode).
      (function(){var m='dark';try{var s=localStorage.getItem('nexusThemeMode');if(s==='light'||s==='dark'){m=s}else if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches){m='light'}}catch(e){}document.documentElement.dataset.theme=m;document.documentElement.style.background=m==='light'?'#FFFFFF':'#0a0806';})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
